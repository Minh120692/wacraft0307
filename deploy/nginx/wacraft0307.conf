# /etc/nginx/conf.d/wacraft0307.conf on astro-web
# Static export (`out/`) served on :3010; public as wacraft-jp.com through Cloudflare Tunnel.

# A page opened before a deploy still holds the old build ID. When its next client
# navigation fetches the new RSC payload (/…/index.txt?_rsc=…), Next 15 sees the
# mismatch and loads that raw .txt URL as a page (doMpaNavigation(res.url)), so
# the visitor lands on https://wacraft-jp.com/index.txt. Browsers mark such a load
# Sec-Fetch-Dest: document; the router's own fetch says "empty".
map $http_sec_fetch_dest $rsc_opened_as_page {
    document 1;
    default  0;
}

# Pages and their RSC payloads change on every deploy, so browsers revalidate them
# (304 via ETag) instead of heuristically caching stale HTML. An empty value sends no header.
map $sent_http_content_type $page_cache_control {
    ~^text/html   "no-cache";
    ~^text/plain  "no-cache";
    default       "";
}

# www → apex, so the site lives on exactly one host.
server {
    listen 3010;
    listen [::]:3010;
    server_name www.wacraft-jp.com;
    return 301 https://wacraft-jp.com$request_uri;
}

server {
    listen 3010 default_server;
    listen [::]:3010 default_server;
    server_name _;

    root /var/www/wacraft0307;
    index index.html;

    # The directory redirect (/about → /about/) must stay relative: an absolute one
    # is built from this listener and leaks http://wacraft-jp.com:3010/…, which is dead.
    absolute_redirect off;

    add_header Cache-Control $page_cache_control;

    # Behind the tunnel Cloudflare sets X-Forwarded-Proto; plain http from the
    # Internet goes to https. Direct LAN requests carry no header and are left alone.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://wacraft-jp.com$request_uri;
    }

    # Pages folded into /about/ when the site was rebuilt around the five services.
    location ~ ^/(en/)?(why-us|team)/?$ {
        return 301 /$1about/;
    }

    # /index.txt → /, /about/index.txt → /about/ (query dropped) when opened as a page.
    location ~ ^(?<rsc_page>/(?:.*/)?)index\.txt$ {
        if ($rsc_opened_as_page) {
            return 302 $rsc_page;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
